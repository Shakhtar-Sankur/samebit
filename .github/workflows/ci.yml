name: conformance

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    env:
      # Hosted macOS runners have no usable GPU; run Metal checks locally.
      SAMEBIT_MLX_DEVICE: cpu
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install -e ".[test]"
          if [ "$RUNNER_OS" = "Linux" ]; then
            python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          else
            python -m pip install torch
          fi
          python -m pip install mlx || echo "mlx not available on this runner"
      - name: Conformance against the golden digest
        run: python -m samebit
      - name: Tests
        run: python -m pytest -q
